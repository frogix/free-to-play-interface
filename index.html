<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Free to play games list from freetogame.com API"/>

		<title>Free to Games</title>
	</head>
	<body>
		<noscript>
			<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;">
				<div style="max-width: 500px; text-align: center;">
					<h1 style="font-size: 24px; margin-bottom: 16px; color: #1a1a1a;">JavaScript Required</h1>
					<p style="font-size: 16px; line-height: 1.5; color: #4a4a4a; margin-bottom: 24px;">
					This application requires JavaScript to run. Please enable JavaScript in your browser settings and reload the page.
					</p>
					<div style="font-size: 14px; color: #6a6a6a;">
						<p style="margin-bottom: 8px;"><strong>How to enable JavaScript:</strong></p>
						<ul style="text-align: left; line-height: 1.8;">
							<li><strong>Chrome:</strong> Settings → Privacy and Security → Site Settings → JavaScript</li>
							<li><strong>Firefox:</strong> about:config → javascript.enabled → true</li>
							<li><strong>Safari:</strong> Preferences → Security → Enable JavaScript</li>
							<li><strong>Edge:</strong> Settings → Cookies and site permissions → JavaScript</li>
						</ul>
					</div>
				</div>
			</div>
		</noscript>

		<div id="root"></div>

		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
